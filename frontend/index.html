<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><circle cx='12' cy='12' r='10'/><path d='M12 2a7 7 0 1 0 10 10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyclone Risk Assessment &amp; Action Dashboard</title>

    <!-- Tailwind CDN for instantaneous rendering without build steps -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#090d16',
              card: '#111827',
              border: '#1f293d',
              accent: '#38bdf8',
            }
          }
        }
      }
    </script>

    <!-- Custom Marker & Popup Styles for Mapbox GL -->
    <style>
      /* ── Cyclone Eye Center Dot (click target for popup) ── */
      .cyclone-eye-dot {
        width: 20px;
        height: 20px;
        position: relative;
        cursor: pointer;
      }
      .cyclone-eye-dot .dot-core {
        position: absolute;
        top: 50%; left: 50%;
        width: 10px; height: 10px;
        background: #ef4444;
        border: 2px solid #fff;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        box-shadow: 0 0 10px rgba(239,68,68,0.8), 0 0 25px rgba(239,68,68,0.4);
      }
      .cyclone-eye-dot .dot-ping {
        position: absolute;
        top: 50%; left: 50%;
        width: 10px; height: 10px;
        border: 2px solid rgba(239, 68, 68, 0.6);
        border-radius: 50%;
        animation: dot-pulse 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        z-index: 4;
      }
      @keyframes dot-pulse {
        0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
        100% { transform: translate(-50%,-50%) scale(4); opacity: 0; }
      }

      /* ── Dark-Themed Mapbox Popups ── */
      .dark-popup .mapboxgl-popup-content {
        background: #111827;
        border: 1px solid #374151;
        border-radius: 10px;
        padding: 10px 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      .dark-popup .mapboxgl-popup-tip {
        border-top-color: #111827;
        border-bottom-color: #111827;
      }
      .dark-popup .mapboxgl-popup-close-button {
        color: #9ca3af;
        font-size: 18px;
        padding: 2px 6px;
      }
      .dark-popup .mapboxgl-popup-close-button:hover {
        color: #fff;
        background: transparent;
      }

      /* ── Hide default Mapbox attribution clutter ── */
      .mapboxgl-ctrl-attrib {
        opacity: 0.4;
        font-size: 9px !important;
      }
      /* ── Toast slide-in animation ── */
      @keyframes slide-in {
        from { transform: translateX(100%); opacity: 0; }
        to   { transform: translateX(0); opacity: 1; }
      }
      .animate-slide-in {
        animation: slide-in 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-[#090d16] text-gray-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
